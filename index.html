<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;color:#111827;font-family:Arial,"Tahoma",sans-serif}
header{background:#111827;color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0002}
header h1{margin:0 0 5px;font-size:22px}
header p{margin:0;color:#cbd5e1;font-size:13px}
.wrap{max-width:780px;margin:auto;padding:14px}
.search{width:100%;border:1px solid #d1d5db;border-radius:14px;padding:13px 15px;font-size:16px;outline:none;margin-bottom:12px;background:#fff}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cat{border:1px solid #d1d5db;background:#fff;border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;color:#374151}
.cat.active,.cat:hover{background:#111827;color:#fff;border-color:#111827}

.top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.num{width:34px;height:34px;border-radius:11px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:bold;font-size:13px;flex-shrink:0}
.title{font-size:16px;font-weight:700;flex:1}
.desc{color:#6b7280;font-size:13px;margin-bottom:10px}
.prompt{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:11px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{border:0;border-radius:12px;padding:12px;font-size:14px;font-weight:700;cursor:pointer}
.copy{background:#111827;color:#fff}
.open{background:#e5e7eb;color:#111827}
button:active{transform:scale(.98)}
.add{width:100%;background:#2563eb;color:#fff;margin:8px 0 14px;padding:13px;border-radius:12px;font-size:15px;font-weight:700;border:0;cursor:pointer}
.editor{display:none;background:#fff;border:1px solid #dbe2ea;border-radius:18px;padding:15px;margin-bottom:14px}
.editor.show{display:block}
input,textarea{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:12px;font-size:15px;margin:5px 0 10px;outline:none}
textarea{min-height:120px;resize:vertical}
.save{background:#16a34a;color:#fff;width:100%;padding:12px;border:0;border-radius:12px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:#6b7280;padding:30px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 17px;border-radius:12px;display:none;z-index:99;font-size:14px}
.footer{text-align:center;color:#9ca3af;font-size:12px;padding:15px}
.stack-bar{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px;margin-bottom:14px;display:none}
.stack-bar.show{display:block}
.stack-codes{font-size:14px;color:#4b5563;margin-bottom:8px;word-break:break-all}
.stack-actions{display:flex;gap:8px}
.stack-actions button{flex:1}
</style>
</head>

<header>
  <h1>🚀 Prompt Hub — 120+ Slash Codes</h1>

</header>

<div class="wrap">

    <div class="stack-actions">

    </div>
  </div>

  <button class="add" onclick="toggleEditor()">＋ إضافة برومبت خاص</button>

  <div id="editor" class="editor">

    <input id="newTag" placeholder="وصف مختصر">
    <textarea id="newPrompt" placeholder="اكتب البرومبت الكامل هنا..."></textarea>
    <button class="save" onclick="saveNew()">حفظ البرومبت</button>
  </div>

  <div id="list"></div>
  <div class="footer">البرومبتات الخاصة تُحفظ على جهازك داخل المتصفح • أكثر من 120 كود جاهز</div>
</div>

<div id="toast" class="toast"></div>

  {cat:"أكواد جديدة قوية", title:"/casual", tag:"أسلوب غير رسمي وودي", prompt:"/casual\nحوّل النص إلى أسلوب غير رسمي وودي ومحادثة."},
  {cat:"أكواد جديدة قوية", title:"/allin", tag:"أقوى وأكمل إجابة ممكنة", prompt:"/allin\nأعطني أقوى وأكمل وأعمق إجابة ممكنة لديك حول هذا الموضوع."}
];

let custom = JSON.parse(localStorage.getItem("promptHubCustom") || "[]");
let items = [...defaults, ...custom];
let currentCat = "الكل";
let selectedStack = new Set();

function initCats() {
  const cats = ["الكل", ...new Set(defaults.map(d => d.cat))];
  const el = document.getElementById("cats");
  el.innerHTML = cats.map(c => 
    `<button class="cat ${c===currentCat?'active':''}" onclick="setCat('${c}')">${c}</button>`
  ).join("");
}

function setCat(c) {
  currentCat = c;
  initCats();
  render();
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = items.filter(x => {
    const matchCat = currentCat === "الكل" || x.cat === currentCat || (!x.cat && currentCat === "الكل");
    const matchSearch = !q || (x.title + " " + (x.tag||"") + " " + x.prompt).toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  const list = document.getElementById("list");
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">لا توجد نتائج.</div>';
    return;
  }

  list.innerHTML = filtered.map((x, i) => `
    <div class="card">
      <div class="top">
        <div class="num">${i+1}</div>
        <div class="title">${escapeHtml(x.title)}</div>
      </div>
      <div class="desc">${escapeHtml(x.tag || "برومبت")}</div>
      <div class="prompt">${escapeHtml(x.prompt)}</div>
      <div class="actions">
        <button class="copy" onclick='copyPrompt(${JSON.stringify(x.prompt)})'>📋 نسخ</button>
        <button class="open" onclick='copyAndOpen(${JSON.stringify(x.prompt)})'>✨ نسخ + فتح Gemini</button>
      </div>
      <div style="margin-top:8px">
        <button style="width:100%;background:#f3f4f6;color:#374151;border:0;border-radius:10px;padding:9px;font-size:13px;cursor:pointer"
          onclick='toggleStack(${JSON.stringify(x.title)})'>
          ${selectedStack.has(x.title) ? "✓ مضاف للستاك" : "＋ أضف للستاك"}
        </button>
      </div>
    </div>
  `).join("");

  updateStackBar();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

async function copyPrompt(text) {
  try {
    await navigator.clipboard.writeText(text);
    toast("تم نسخ البرومبت ✓");
  } catch(e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    toast("تم نسخ البرومبت ✓");
  }
}

async function copyAndOpen(text) {
  const w = window.open("https://gemini.google.com/app", "_blank");
  await copyPrompt(text);
  if (!w) toast("تم النسخ. افتح Gemini يدوياً إذا لم تفتح الصفحة.");
}

function toggleStack(title) {
  if (selectedStack.has(title)) selectedStack.delete(title);
  else selectedStack.add(title);
  render();
}

function updateStackBar() {
  const bar = document.getElementById("stackBar");
  const codes = document.getElementById("stackCodes");
  if (selectedStack.size === 0) {
    bar.classList.remove("show");
    return;
  }
  bar.classList.add("show");
  codes.textContent = "الأكواد المختارة: " + Array.from(selectedStack).join("  ");
}

function copyStack() {
  if (selectedStack.size === 0) return;
  const text = Array.from(selectedStack).join(" ") + "\n";
  copyPrompt(text);
}

function clearStack() {
  selectedStack.clear();
  render();
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(window.tt);
  window.tt = setTimeout(() => t.style.display = "none", 1800);
}

function toggleEditor() {
  document.getElementById("editor").classList.toggle("show");
}

function saveNew() {
  const title = document.getElementById("newTitle").value.trim();
  const tag = document.getElementById("newTag").value.trim();
  const prompt = document.getElementById("newPrompt").value.trim();
  if (!title || !prompt) {
    toast("اكتب اسم البرومبت والنص أولاً");
    return;
  }
  custom.push({title, tag: tag || "برومبت مخصص", prompt, cat: "مخصص"});
  localStorage.setItem("promptHubCustom", JSON.stringify(custom));
  items = [...defaults, ...custom];
  document.getElementById("newTitle").value = "";
  document.getElementById("newTag").value = "";
  document.getElementById("newPrompt").value = "";
  document.getElementById("editor").classList.remove("show");
  render();
  toast("تم حفظ البرومبت ✓");
}

initCats();
render();
</script>
